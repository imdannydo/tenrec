name: Feature idea
description: Suggest something that would make Tenrec better
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Tenrec to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: When would you use it? What does it make easier?
